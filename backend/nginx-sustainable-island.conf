server {
    listen 443 ssl;
    server_name 8a3ba41a-c44d-4dc1-a5ff.3191914b3add.sites.escritorios.ieselrincon.es;

    # Rutas absolutas a los certificados (ajusta si están en otro directorio)
    ssl_certificate     /etc/nginx/fullchain.pem;
    ssl_certificate_key /etc/nginx/privkey.pem;

    # Protocolos y cifrados recomendados
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass         http://127.0.0.1:8080/;

        # Cabeceras esenciales para que Spring Boot sepa el origen real
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  $server_port;

        # Timeouts para peticiones lentas de Spring
        proxy_connect_timeout  10s;
        proxy_read_timeout     90s;
        proxy_send_timeout     90s;

        # Buffer para respuestas grandes (uploads de imágenes)
        proxy_buffer_size        128k;
        proxy_buffers          4 256k;
        proxy_busy_buffers_size  256k;
    }
}

# Redirigir HTTP a HTTPS
server {
    listen 80;
    server_name 8a3ba41a-c44d-4dc1-a5ff.3191914b3add.sites.escritorios.ieselrincon.es;
    return 301 https://$host$request_uri;
}
