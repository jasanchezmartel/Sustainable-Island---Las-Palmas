spring.application.name=SeaZen

# ===== MySQL Database =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/seazen?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=sasa1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== Flyway Configuration =====
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# ===== JWT Configuration =====
application.security.jwt.secret-key=thisisanacademyprojectmadebystudentsinieselrinconifyouareseeingthisisayhellofromcanaryislandsthisisanacademyprojectmadebystudentsinieselrinconifyouareseeingthisisayhellofromcanaryislandsthisisanacademyprojectmadebystudentsinieselrinconifyouareseeingthisisayhellofromcanaryislands
application.security.jwt.expiration=86400000

# ===== Server Configuration =====
server.port=8080

# ===== CORS Configuration =====
cors.allowed-origins=http://localhost:5173

# ===== File Upload Configuration =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== File Storage =====
app.file-upload-dir=uploads/

# ===== Logs Configuration =====
logging.file.name=logs/seazen.log
logging.logback.rollingpolicy.file-name-pattern=logs/seazen.%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.rollover-on-startup=false
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=100MB